name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build, Validate and Publish Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Debug Keystore and Assemble APK
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            gradle :app:assembleDebug --no-daemon
          fi

          unzip -tq "$APK_PATH"

          ACTUAL_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SIZE_HUMAN=$(du -h "$APK_PATH" | awk '{print $1}')

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "sha256=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_SIZE_HUMAN" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.verify.outputs.apk_path }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
          SIZE_HUMAN: ${{ steps.verify.outputs.size_human }}
          SIZE_BYTES: ${{ steps.verify.outputs.size_bytes }}
        run: |
          set -euo pipefail
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Juddles v3.0 Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
          Installable Android Debug APK for **Juddles v3.0**.

          - **Asset**: \`app-debug.apk\`
          - **Size**: ${SIZE_HUMAN} (${SIZE_BYTES} bytes)
          - **SHA-256**: \`${SHA256}\`
          EOF
          )

          gh release create "$TAG" "${APK_PATH}#app-debug.apk" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          LATEST_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "download_url=$LATEST_DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          {
            echo "## Android Debug APK Published"
            echo ""
            echo "- **Release Tag**: \`${TAG}\`"
            echo "- **APK Size**: ${SIZE_HUMAN} (${SIZE_BYTES} bytes)"
            echo "- **SHA-256 Checksum**: \`${SHA256}\`"
            echo "- **GitHub Release Page**: ${RELEASE_URL}"
            echo "- **Direct Latest APK Download URL**: ${LATEST_DOWNLOAD_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
